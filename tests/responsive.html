<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOTTOMON RECALL — responsive layout check</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#26313d;color:#f0f4f8;font:14px system-ui,sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:12px 18px;flex-wrap:wrap}
  button{font:inherit;padding:10px 14px;background:#d6e4ed;border:0;border-radius:3px;cursor:pointer;color:#132331}
  button[aria-pressed=true]{outline:2px solid #e9c478;outline-offset:2px}
  main{display:flex;justify-content:center;padding:0 16px 16px;min-width:fit-content}
  iframe{width:390px;height:844px;border:1px solid #657887;background:#091623}
</style>
<header>
  <strong>Layout check</strong>
  <button data-width="320" aria-pressed="false">320px</button>
  <button data-width="390" aria-pressed="true">390px</button>
  <button data-width="768" aria-pressed="false">768px</button>
  <button data-width="1280" aria-pressed="false">1280px</button>
  <span>Resizing preserves the run. Reloading starts fresh.</span>
</header>
<main><iframe title="Playable game viewport" src="../index.html"></iframe></main>
<script>
  document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{
    document.querySelector('iframe').style.width=button.dataset.width+'px';
    document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  }));
</script>
</html>
